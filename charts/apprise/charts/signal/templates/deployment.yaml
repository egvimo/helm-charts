{{- include "common.deployment" (list . "signal.deployment") -}}
{{- define "signal.deployment" -}}
spec:
  template:
    spec:
      initContainers:
        - name: prepare
          image: busybox
          command:
            - chown
            - "11319:11319"
            - /run
            - /tmp/s6-runtime
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: run
              mountPath: /run
            - name: s6-runtime
              mountPath: /tmp/s6-runtime
      containers:
        - env:
            - name: MODE
              value: {{ .Values.signalCli.mode | quote }}
            {{- if .Values.signalCli.autoReceiveSchedule }}
            - name: AUTO_RECEIVE_SCHEDULE
              value: {{ .Values.signalCli.autoReceiveSchedule | quote }}
            {{- end }}
            - name: SIGNAL_CLI_UID
              value: "11319"
            - name: SIGNAL_CLI_GID
              value: "11319"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
          volumeMounts:
            - name: config
              mountPath: /home/.local/share/signal-cli
            - name: run
              mountPath: /run
          {{- include "common.container" . | nindent 10 }}
      volumes:
        - name: config
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "common.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: run
          emptyDir: {}
        - name: s6-runtime
          emptyDir: {}
{{- end -}}
